<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Clay tile background -->
  <rect width="1200" height="630" fill="#B5562F"/>

  <!-- Soft accent halo -->
  <circle cx="600" cy="200" r="300" fill="rgba(250, 248, 243, 0.08)"/>

  <!-- Mark — hook silhouette, single cream stroke -->
  <svg viewBox="12 14 76 76" x="455" y="115" width="290" height="290">
    <path d="M70 78 V46 A20 20 0 0 0 30 46 V57" fill="none" stroke="#FAF8F3" stroke-width="13" stroke-linecap="round"/>
    <line x1="30" y1="57" x2="45" y2="69" stroke="#FAF8F3" stroke-width="13" stroke-linecap="round"/>
  </svg>

  <!-- Wordmark + tagline (Bitter / Karla; fall back to serif/sans if unloaded) -->
  <text x="600" y="475" text-anchor="middle" fill="#FAF8F3"
        font-family="Bitter, Georgia, serif" font-size="88" font-weight="500"
        letter-spacing="-1.2">anchor</text>
  <text x="600" y="545" text-anchor="middle" fill="rgba(250, 248, 243, 0.78)"
        font-family="Karla, system-ui, sans-serif" font-size="28" font-weight="400"
        letter-spacing="0.4">a steadier start</text>
</svg>
